[project]
name = "developer-knowledge-rag"
version = "0.2.0"
description = "Traceable technical-document RAG adapted from Pasukalu/rag-qa-system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
 "fastembed==0.7.4", "rank-bm25==0.2.2", "fastapi>=0.115,<1",
 "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "numpy>=1.26,<3",
 "httpx>=0.27,<1", "openai>=1.30,<3", "pydantic>=2,<3",
 "huggingface-hub>=0.23,<2", "python-dotenv>=1,<2", "langdetect==1.0.9"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
rag-serve = "app.main:run"
rag-ingest = "scripts.ingest:main"
rag-eval = "eval.run_eval:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*", "eval*", "scripts*"]
[tool.ruff]
extend-exclude = ["data/corpus/*.py"]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"app/api/ui.py" = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
